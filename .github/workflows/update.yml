name: Live update from SAFF

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # backup every 10 minutes; cron-job.org triggers it every 2 minutes
  workflow_dispatch:
    inputs:
      full:
        description: "Read every club page now (yes/no)"
        required: false
        default: "no"
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]   # overrides.json is applied by the next timed run, within 10 minutes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # a code push gets its own lane, so the two minute data runs can never cancel its deploy
  group: ${{ github.event_name == 'push' && 'code-push' || 'live-update' }}
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read SAFF and update data.js
        run: node scripts/league.mjs
        env:
          FULL: ${{ (github.event_name == 'push' || github.event.inputs.full == 'yes') && '1' || '' }}
      - name: Read SAFF Roshn league and update data-spl.js
        run: node scripts/league.mjs || echo "Roshn step failed; data left as it was"
        env:
          LEAGUE: spl
          FULL: ${{ (github.event_name == 'push' || github.event.inputs.full == 'yes') && '1' || '' }}
      - name: Read SAFF discipline decisions
        run: node scripts/discipline.mjs || echo "discipline step failed; data left as it was"
      - name: Read SAFF discipline decisions for the Roshn league
        run: node scripts/discipline.mjs || echo "Roshn discipline step failed; data left as it was"
        env:
          LEAGUE: spl
      - name: Club calendars, data files, phone alerts and updater check
        run: node scripts/feeds.mjs || echo "feeds step failed; the board itself is unaffected"
      - name: Commit when the data changed
        id: commit
        run: |
          if git diff --quiet -- site/data.js site/data-spl.js site/discipline-data.js site/discipline-data-spl.js && [ -z "$(git status --porcelain -- site/discipline-data.js site/discipline-data-spl.js site/logos site/feeds .state)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "yelo-live-update"
            git config user.email "actions@users.noreply.github.com"
            git add site/data.js last-run.json site/data-spl.js
            if [ -f last-run-spl.json ]; then git add last-run-spl.json; fi
            if [ -d site/logos ]; then git add site/logos; fi
            if [ -d site/feeds ]; then git add site/feeds; fi
            if [ -d .state ]; then git add .state; fi
            if [ -f site/discipline-data.js ]; then git add site/discipline-data.js; fi
            if [ -f site/discipline-data-spl.js ]; then git add site/discipline-data-spl.js; fi
            git commit -m "Live update from SAFF $(date -u +%Y-%m-%dT%H:%MZ)"
            # a code push may have landed while this run was reading SAFF: put the data commit on top of it
            for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: always() && (github.event_name == 'push' || needs.update.outputs.changed == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        continue-on-error: true   # GitHub refuses a deploy while another one is still running
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure'
        run: sleep 90
      - if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
